<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AhamCure – Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #B8965A;
      --gold-light: #D4B483;
      --gold-pale: #EDD99A;
      --dark: #0D0B08;
      --text: #F5EDD8;
      --muted: #9A8B70;
    }

    html, body { height: 100%; min-height: 100vh; }

    body {
      font-family: 'Jost', sans-serif;
      background: var(--dark);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }
    .orb1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(184,150,90,0.15) 0%, transparent 70%);
      top: -150px; left: -150px;
      animation: orbFloat 12s ease-in-out infinite;
    }
    .orb2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(184,150,90,0.10) 0%, transparent 70%);
      bottom: -100px; right: -100px;
      animation: orbFloat 12s ease-in-out infinite;
      animation-delay: -6s;
    }
    .orb3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(212,180,131,0.08) 0%, transparent 70%);
      top: 50%; left: 50%;
      animation: orbFloat3 10s ease-in-out infinite;
    }
    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0); }
      33% { transform: translate(30px, -20px); }
      66% { transform: translate(-20px, 30px); }
    }
    @keyframes orbFloat3 {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.2); }
    }

    .deco-line { position: fixed; pointer-events: none; opacity: 0.15; }
    .deco-line.top { top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(to right, transparent, var(--gold), transparent); }
    .deco-line.bottom { bottom: 0; left: 0; right: 0; height: 1px; background: linear-gradient(to right, transparent, var(--gold), transparent); }
    .deco-line.left { left: 0; top: 0; bottom: 0; width: 1px; background: linear-gradient(to bottom, transparent, var(--gold), transparent); }
    .deco-line.right { right: 0; top: 0; bottom: 0; width: 1px; background: linear-gradient(to bottom, transparent, var(--gold), transparent); }

    .main {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px 24px;
      width: 100%;
      max-width: 700px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 0.5px solid rgba(184,150,90,0.4);
      padding: 8px 20px;
      border-radius: 100px;
      margin-bottom: 48px;
      animation: fadeDown 0.8s ease both;
    }
    .badge-dot {
      width: 6px; height: 6px;
      background: var(--gold);
      border-radius: 50%;
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .badge-text {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold-light);
      font-weight: 300;
    }

    .brand-wrap {
      margin-bottom: 20px;
      animation: fadeUp 0.9s ease 0.1s both;
    }
    .brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(52px, 12vw, 88px);
      font-weight: 300;
      letter-spacing: 6px;
      color: var(--text);
      line-height: 1;
      text-transform: uppercase;
    }
    .brand span {
      color: var(--gold);
      font-style: italic;
      font-weight: 400;
      letter-spacing: 4px;
    }

    .gold-rule {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 28px 0;
      width: 280px;
      animation: fadeUp 0.9s ease 0.2s both;
    }
    .gold-rule::before, .gold-rule::after {
      content: '';
      flex: 1;
      height: 0.5px;
      background: var(--gold);
      opacity: 0.5;
    }
    .gold-rule-diamond {
      width: 7px; height: 7px;
      background: var(--gold);
      transform: rotate(45deg);
      opacity: 0.8;
      flex-shrink: 0;
    }

    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(18px, 4vw, 26px);
      font-weight: 300;
      font-style: italic;
      color: var(--gold-light);
      letter-spacing: 1px;
      margin-bottom: 12px;
      animation: fadeUp 0.9s ease 0.25s both;
    }

    .sub {
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 200;
      margin-bottom: 56px;
    }



    /* Social links */
    .socials {
      display: flex;
      gap: 24px;
      animation: fadeUp 0.9s ease 0.5s both;
    }
    .social-link {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 300;
      padding: 8px 0;
      border-bottom: 0.5px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .social-link:hover {
      color: var(--gold-light);
      border-bottom-color: rgba(184,150,90,0.4);
    }
    .social-link svg { width: 14px; height: 14px; fill: currentColor; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .footer {
      position: fixed;
      bottom: 24px;
      left: 0; right: 0;
      text-align: center;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(154,139,112,0.4);
      z-index: 2;
    }

    @media (max-width: 480px) {
      .count-item { min-width: 55px; }
    }
  </style>
</head>
