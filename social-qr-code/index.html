<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AhamCure – Connect With Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #3D6B35;
      --green-light: #5A8F4F;
      --green-dark: #2A4A24;
      --cream: #F5F3EE;
      --text: #1E3318;
      --muted: #6B8B63;
    }
    html, body { height: 100%; min-height: 100vh; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 20%, rgba(61,107,53,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 50% 60% at 80% 80%, rgba(61,107,53,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    .frame {
      position: fixed;
      inset: 16px;
      border: 1px solid rgba(61,107,53,0.25);
      border-radius: 4px;
      pointer-events: none;
      z-index: 0;
    }
    .main {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 32px;
      width: 100%;
      max-width: 520px;
      gap: 0;
    }
    .logo-wrap {
      margin-bottom: 28px;
      animation: fadeUp 0.6s ease both;
    }
    .logo-wrap img {
      width: 200px;
      height: auto;
      object-fit: contain;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      margin-bottom: 32px;
      animation: fadeUp 0.6s ease 0.1s both;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 0.5px;
      background: linear-gradient(to right, transparent, var(--green), transparent);
      opacity: 0.5;
    }
    .divider-icon {
      width: 7px; height: 7px;
      background: var(--green);
      transform: rotate(45deg);
      opacity: 0.6;
      flex-shrink: 0;
    }
    .connect-text {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 28px;
      font-weight: 300;
      letter-spacing: 0.5px;
      animation: fadeUp 0.6s ease 0.15s both;
    }
    .social-buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      animation: fadeUp 0.6s ease 0.2s both;
    }
    .social-btn {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 20px 28px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      font-family: 'DM Sans', sans-serif;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .social-btn:hover { transform: translateY(-3px); }
    .social-btn:active { transform: scale(0.98); }
    .btn-facebook {
      background: #1877F2;
      box-shadow: 0 8px 32px rgba(24,119,242,0.28);
    }
    .btn-facebook:hover { box-shadow: 0 12px 40px rgba(24,119,242,0.42); }
    .btn-instagram {
      background: linear-gradient(135deg, #F58529 0%, #DD2A7B 50%, #8134AF 100%);
      box-shadow: 0 8px 32px rgba(221,42,123,0.28);
    }
    .btn-instagram:hover { box-shadow: 0 12px 40px rgba(221,42,123,0.42); }
    .btn-icon {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.20);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .btn-icon svg { width: 22px; height: 22px; }
    .btn-content { display: flex; flex-direction: column; text-align: left; }
    .btn-label { font-size: 17px; font-weight: 500; color: #fff; line-height: 1.2; }
    .btn-sub { font-size: 12px; color: rgba(255,255,255,0.75); font-weight: 300; margin-top: 2px; }
    .btn-arrow { margin-left: auto; opacity: 0.6; transition: transform 0.2s, opacity 0.2s; }
    .social-btn:hover .btn-arrow { transform: translateX(4px); opacity: 1; }
    .footer-mark {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: fadeUp 0.6s ease 0.3s both;
    }
    .footer-dots { display: flex; gap: 6px; }
    .footer-dots span { width: 4px; height: 4px; background: var(--green); border-radius: 50%; opacity: 0.3; }
    .footer-dots span:nth-child(2) { opacity: 0.6; }
    .footer-text { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); opacity: 0.6; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 480px) {
      .main { padding: 40px 20px; }
      .logo-wrap img { width: 160px; }
    }
  </style>
</head>
<body>
  <div class="frame"></div>
  <main class="main">
    <div class="logo-wrap">
      <img src="AhamCure_logo.jpeg" alt="AhamCure Logo" />
    </div>
    <div class="divider"><div class="divider-icon"></div></div>
    <p class="connect-text">Follow us on social media to stay connected</p>
    <div class="social-buttons">
      <a class="social-btn btn-facebook" href="https://www.facebook.com/share/18Bojk3x4L/" target="_blank" rel="noopener noreferrer">
        <div class="btn-icon">
          <svg viewBox="0 0 24 24" fill="white"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        </div>
        <div class="btn-content">
          <span class="btn-label">Facebook</span>
          <span class="btn-sub">Like our page &amp; stay updated</span>
        </div>
        <svg class="btn-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
      <a class="social-btn btn-instagram" href="https://www.instagram.com/invites/contact/?utm_source=ig_contact_invite&utm_medium=copy_link&utm_content=i94yleu" target="_blank" rel="noopener noreferrer">
        <div class="btn-icon">
          <svg viewBox="0 0 24 24" fill="white"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
        </div>
        <div class="btn-content">
          <span class="btn-label">Instagram</span>
          <span class="btn-sub">See our latest posts &amp; stories</span>
        </div>
        <svg class="btn-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
    </div>
    <div class="footer-mark">
      <div class="footer-dots"><span></span><span></span><span></span></div>
      <p class="footer-text">ahamcure.com</p>
    </div>
  </main>
</body>
</html>
